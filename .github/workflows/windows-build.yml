name: DownTrack Windows Build

on:
  push:
    branches: [ main, "**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: downtrack-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-package:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore DownTrack.sln -r win-x64 -p:Platform=x64

      - name: Build
        run: dotnet build DownTrack.sln -c Release --no-restore -p:Platform=x64

      - name: Publish self-contained x64
        run: >
          dotnet publish src/DownTrack.App/DownTrack.App.csproj
          -c Release -r win-x64 --self-contained true
          --no-restore -o artifacts/publish -p:Platform=x64

      - name: Bundle Media Engine into installer payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tools = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish\Tools"
          $download = Join-Path $env:RUNNER_TEMP "downtrack-tools"
          New-Item -ItemType Directory -Force -Path $tools,$download | Out-Null

          function Download-VerifiedAsset {
            param([string]$Url,[string]$ChecksumUrl,[string]$OutputPath,[string]$ExpectedHash)
            $assetName = [IO.Path]::GetFileName($OutputPath)
            $tempPath = Join-Path $download ($assetName + ".download")
            $checksumPath = Join-Path $download ($assetName + ".sha256")
            Invoke-WebRequest -Uri $Url -OutFile $tempPath -UseBasicParsing
            if ($ChecksumUrl) { Invoke-WebRequest -Uri $ChecksumUrl -OutFile $checksumPath -UseBasicParsing }
            if (-not $ExpectedHash) {
              $checksumText = Get-Content -Path $checksumPath -Raw
              $match = [regex]::Match($checksumText,"(?i)\b[a-f0-9]{64}\b")
              if (-not $match.Success) { throw "No SHA-256 checksum was found for $assetName." }
              $ExpectedHash = $match.Value
            }
            $actual = (Get-FileHash -Algorithm SHA256 $tempPath).Hash
            if ($actual -ne $ExpectedHash) { throw "SHA-256 verification failed for $assetName. Expected $ExpectedHash but received $actual." }
            Move-Item -Force $tempPath $OutputPath
          }

          Download-VerifiedAsset "https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19/yt-dlp.exe" $null (Join-Path $tools "yt-dlp.exe") "66674953fe251b89f4d08c5f0e35e0728679bd67ab3d7d05c0562af101dd3e7a"

          Download-VerifiedAsset "https://github.com/denoland/deno/releases/download/v2.9.7/deno-x86_64-pc-windows-msvc.zip" $null (Join-Path $download "deno.zip") "a0c3101b4158d1dfb7d6a78a7bf0f3de80c96bb423c152beec8beb22786f2238"
          $denoExtract = Join-Path $download "deno-extract"
          Expand-Archive -Path (Join-Path $download "deno.zip") -DestinationPath $denoExtract -Force
          $deno = Get-ChildItem $denoExtract -Filter "deno.exe" -Recurse | Select-Object -First 1
          if (-not $deno) { throw "Deno archive did not contain deno.exe." }
          Copy-Item $deno.FullName (Join-Path $tools "deno.exe") -Force

          Download-VerifiedAsset "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip.sha256" (Join-Path $download "ffmpeg.zip") $null
          $ffmpegExtract = Join-Path $download "ffmpeg-extract"
          Expand-Archive -Path (Join-Path $download "ffmpeg.zip") -DestinationPath $ffmpegExtract -Force
          $ffmpeg = Get-ChildItem $ffmpegExtract -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem $ffmpegExtract -Filter "ffprobe.exe" -Recurse | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "FFmpeg package did not contain ffmpeg.exe and ffprobe.exe." }
          Copy-Item $ffmpeg.FullName (Join-Path $tools "ffmpeg.exe") -Force
          Copy-Item $ffprobe.FullName (Join-Path $tools "ffprobe.exe") -Force

          & (Join-Path $tools "yt-dlp.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled yt-dlp self-test failed." }
          & (Join-Path $tools "deno.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Deno self-test failed." }
          & (Join-Path $tools "ffmpeg.exe") -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled FFmpeg self-test failed." }
          & (Join-Path $tools "ffprobe.exe") -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled ffprobe self-test failed." }

          Get-ChildItem $tools | Select-Object Name,Length
      - name: Verify installer payload contains Media Engine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tools = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish\Tools"
          foreach ($file in @("yt-dlp.exe","ffmpeg.exe","ffprobe.exe","deno.exe")) {
            if (-not (Test-Path (Join-Path $tools $file))) { throw "Installer payload is missing $file." }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetEnvironmentVariable("ProgramFiles(x86)")
          $issc = if ($programFilesX86) {
            Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe"
          } else {
            $null
          }
          if (-not $issc -or -not (Test-Path $issc)) {
            $issc = Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $issc)) {
            throw "Inno Setup compiler (ISCC.exe) was not found."
          }
          & $issc "installer\DownTrack.iss"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build lightweight Web Installer payload
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $payload = Join-Path $releaseDir "DownTrack-Payload.zip"
          if (Test-Path $payload) { Remove-Item $payload -Force }
          Compress-Archive -Path (Join-Path $env:GITHUB_WORKSPACE "artifacts\publish\*") -DestinationPath $payload -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $payload).Hash.ToLowerInvariant()
          $size = (Get-Item $payload).Length
          $template = Get-Content -Raw (Join-Path $env:GITHUB_WORKSPACE "installer\DownTrackWebSetup.iss.template")
          $script = $template.Replace("__PAYLOAD_SIZE__", [string]$size).Replace("__PAYLOAD_HASH__", $hash)
          $webScript = Join-Path $env:GITHUB_WORKSPACE "installer\DownTrackWebSetup.generated.iss"
          Set-Content -Path $webScript -Value $script -Encoding UTF8
          $programFilesX86 = [Environment]::GetEnvironmentVariable("ProgramFiles(x86)")
          $issc = if ($programFilesX86) { Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe" } else { $null }
          if (-not $issc -or -not (Test-Path $issc)) { $issc = Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $issc)) { throw "Inno Setup compiler was not found." }
          & $issc $webScript
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Payload SHA-256: $hash"
          Write-Host "Payload bytes: $size"
          Get-ChildItem $releaseDir | Select-Object Name,Length

      - name: Verify lightweight Web Installer
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $webSetup = "artifacts/installer/DownTrack-WebSetup.exe"
          $payload = "artifacts/release/DownTrack-Payload.zip"
          if (-not (Test-Path $webSetup)) { throw "Web installer was not created." }
          if (-not (Test-Path $payload)) { throw "Web installer payload was not created." }
          $webSize = (Get-Item $webSetup).Length
          if ($webSize -gt 15MB) { throw "Web installer is unexpectedly large: $webSize bytes." }
          Write-Host "Web installer bytes: $webSize"
          Write-Host "Web installer hash: $((Get-FileHash -Algorithm SHA256 $webSetup).Hash)"

      - name: Build always-latest Bootstrapper
        if: github.event_name == 'push'
        shell: pwsh
        env:
          DOWNTRACK_VERSION: "0.1.${{ github.run_number }}"
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\release"
          $installerDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\installer"
          New-Item -ItemType Directory -Force -Path $releaseDir,$installerDir | Out-Null

          $payload = Join-Path $releaseDir "DownTrack-Payload.zip"
          if (-not (Test-Path $payload)) { throw "Payload is missing before bootstrapper build." }
          $payloadHash = (Get-FileHash -Algorithm SHA256 $payload).Hash.ToLowerInvariant()
          $payloadSize = (Get-Item $payload).Length

          $manifest = @"
          [release]
          Version=$env:DOWNTRACK_VERSION
          Channel=nightly
          PayloadUrl=https://github.com/MediaForge2446/DownTrack/releases/download/nightly/DownTrack-Payload.zip
          PayloadSha256=$payloadHash
          PayloadSize=$payloadSize
          YtDlpVersion=2026.08.19
          DenoVersion=2.9.7
          FfmpegVersion=current-essentials
          "@
          Set-Content -Path (Join-Path $releaseDir "latest.ini") -Value $manifest -Encoding UTF8

          $programFilesX86 = [Environment]::GetEnvironmentVariable("ProgramFiles(x86)")
          $issc = if ($programFilesX86) { Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe" } else { $null }
          if (-not $issc -or -not (Test-Path $issc)) { $issc = Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $issc)) { throw "Inno Setup compiler was not found." }

          & $issc "installer\DownTrackBootstrapper.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $bootstrapper = Join-Path $installerDir "DownTrack-Installer.exe"
          if (-not (Test-Path $bootstrapper)) { throw "Bootstrapper was not created." }

          $size = (Get-Item $bootstrapper).Length
          if ($size -gt 15MB) { throw "Bootstrapper is unexpectedly large: $size bytes." }

          Write-Host "Latest version: $env:DOWNTRACK_VERSION"
          Write-Host "Payload SHA-256: $payloadHash"
          Write-Host "Payload bytes: $payloadSize"
          Write-Host "Bootstrapper bytes: $size"
          Write-Host "Bootstrapper SHA-256: $((Get-FileHash -Algorithm SHA256 $bootstrapper).Hash)"
          Get-Content (Join-Path $releaseDir "latest.ini")

      - name: Upload Web Installer artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: DownTrack-WebInstaller
          path: |
            artifacts/installer/DownTrack-WebSetup.exe
            artifacts/release/DownTrack-Payload.zip
          if-no-files-found: error

      - name: Publish Nightly Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          gh release view nightly --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create nightly --repo $env:GITHUB_REPOSITORY --title "DownTrack Nightly" --notes "Latest validated DownTrack build from main." --prerelease --latest=false
            if ($LASTEXITCODE -ne 0) { throw "Failed to create nightly release." }
          }
          gh release upload nightly "artifacts/release/DownTrack-Payload.zip" "artifacts/release/latest.ini" "artifacts/installer/DownTrack-Installer.exe" "artifacts/installer/DownTrack-WebSetup.exe" "artifacts/installer/Setup.exe" --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish nightly release assets." }

      - name: Upload Bootstrapper artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: DownTrack-Bootstrapper
          path: |
            artifacts/installer/DownTrack-Installer.exe
            artifacts/release/latest.ini
          if-no-files-found: error

      - name: Upload Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: DownTrack-Setup
          path: artifacts/installer/Setup.exe
          if-no-files-found: error
