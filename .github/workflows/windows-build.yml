name: DownTrack Windows Build

on:
  push:
    branches: [ main, "**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: downtrack-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-package:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore DownTrack.sln -r win-x64 -p:Platform=x64

      - name: Build
        run: dotnet build DownTrack.sln -c Release --no-restore -p:Platform=x64

      - name: Publish self-contained x64
        run: >
          dotnet publish src/DownTrack.App/DownTrack.App.csproj
          -c Release -r win-x64 --self-contained true
          --no-restore -o artifacts/publish -p:Platform=x64

      - name: Bundle Media Engine into installer payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tools = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish\Tools"
          $download = Join-Path $env:RUNNER_TEMP "downtrack-tools"
          New-Item -ItemType Directory -Force -Path $tools,$download | Out-Null

          function Download-VerifiedAsset {
            param([string]$Url,[string]$ChecksumUrl,[string]$OutputPath,[string]$AssetName)
            $tempPath = Join-Path $download ([IO.Path]::GetFileName($OutputPath) + ".download")
            $checksumPath = Join-Path $download ($AssetName + ".sha256")
            Invoke-WebRequest -Uri $Url -OutFile $tempPath -UseBasicParsing
            Invoke-WebRequest -Uri $ChecksumUrl -OutFile $checksumPath -UseBasicParsing
            $checksumText = Get-Content -Path $checksumPath -Raw
            $pattern = "(?im)([a-f0-9]{64}).*" + [regex]::Escape($AssetName)
            $match = [regex]::Match($checksumText,$pattern)
            if (-not $match.Success) { throw "No SHA-256 checksum was found for $AssetName." }
            $expected = $match.Groups[1].Value.ToUpperInvariant()
            $actual = (Get-FileHash -Algorithm SHA256 $tempPath).Hash.ToUpperInvariant()
            if ($actual -ne $expected) { throw "SHA-256 verification failed for $AssetName. Expected $expected but received $actual." }
            Move-Item -Force $tempPath $OutputPath
          }

          Download-VerifiedAsset "https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19/yt-dlp.exe" "https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19/SHA2-256SUMS" (Join-Path $tools "yt-dlp.exe") "yt-dlp.exe"
          Download-VerifiedAsset "https://github.com/denoland/deno/releases/download/v2.9.7/deno-x86_64-pc-windows-msvc.zip" "https://github.com/denoland/deno/releases/download/v2.9.7/deno-x86_64-pc-windows-msvc.zip.sha256sum" (Join-Path $download "deno.zip") "deno-x86_64-pc-windows-msvc.zip"

          $denoExtract = Join-Path $download "deno-extract"
          Expand-Archive -Path (Join-Path $download "deno.zip") -DestinationPath $denoExtract -Force
          $deno = Get-ChildItem $denoExtract -Filter "deno.exe" -Recurse | Select-Object -First 1
          if (-not $deno) { throw "Deno archive did not contain deno.exe." }
          Copy-Item $deno.FullName (Join-Path $tools "deno.exe") -Force

          Download-VerifiedAsset "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip.sha256" (Join-Path $download "ffmpeg.zip") "ffmpeg-release-essentials.zip"

          $ffmpegExtract = Join-Path $download "ffmpeg-extract"
          Expand-Archive -Path (Join-Path $download "ffmpeg.zip") -DestinationPath $ffmpegExtract -Force
          $ffmpeg = Get-ChildItem $ffmpegExtract -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem $ffmpegExtract -Filter "ffprobe.exe" -Recurse | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "FFmpeg package did not contain ffmpeg.exe and ffprobe.exe." }
          Copy-Item $ffmpeg.FullName (Join-Path $tools "ffmpeg.exe") -Force
          Copy-Item $ffprobe.FullName (Join-Path $tools "ffprobe.exe") -Force

          & (Join-Path $tools "yt-dlp.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled yt-dlp self-test failed." }
          & (Join-Path $tools "deno.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Deno self-test failed." }
          & (Join-Path $tools "ffmpeg.exe") -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled FFmpeg self-test failed." }
          & (Join-Path $tools "ffprobe.exe") -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled ffprobe self-test failed." }

          Get-ChildItem $tools | Select-Object Name,Length
      - name: Verify installer payload contains Media Engine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tools = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish\Tools"
          foreach ($file in @("yt-dlp.exe","ffmpeg.exe","ffprobe.exe","deno.exe")) {
            if (-not (Test-Path (Join-Path $tools $file))) { throw "Installer payload is missing $file." }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetEnvironmentVariable("ProgramFiles(x86)")
          $issc = if ($programFilesX86) {
            Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe"
          } else {
            $null
          }
          if (-not $issc -or -not (Test-Path $issc)) {
            $issc = Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $issc)) {
            throw "Inno Setup compiler (ISCC.exe) was not found."
          }
          & $issc "installer\DownTrack.iss"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: DownTrack-Setup
          path: artifacts/installer/Setup.exe
          if-no-files-found: error
